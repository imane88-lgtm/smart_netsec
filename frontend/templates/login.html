<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart NetSec SOC — Connexion</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-body">

<!-- Fond animé -->
<div class="auth-bg">
  <div class="auth-bg-circle"></div>
  <div class="auth-bg-circle"></div>
  <div class="auth-bg-circle"></div>
</div>
<div class="auth-grid"></div>

<!-- Bouton thème -->
<button id="auth-theme-btn" class="auth-theme-btn" title="Changer le thème">
  <i class="fas fa-moon" id="theme-icon"></i>
</button>

<!-- Container -->
<div class="auth-container">

  <!-- Logo -->
  <div class="auth-logo">
    <div class="auth-logo-icon">
      <i class="fas fa-shield-alt"></i>
    </div>
    <div class="auth-logo-title">Smart NetSec SOC</div>
    <div class="auth-logo-sub">Security Operations Center</div>
    <div class="auth-logo-names">
      <span>MRINO</span>
      <span class="auth-logo-sep">|</span>
      <span>BOUZIDI</span>
    </div>
  </div>

  <!-- Card -->
  <div class="auth-card">

    <div class="auth-card-title">Connexion</div>
    <div class="auth-card-sub">Accès réservé au personnel autorisé</div>

    {% if error %}
    <div class="auth-alert error">
      <i class="fas fa-exclamation-triangle"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login" autocomplete="off" novalidate>

      <div class="form-group">
        <label class="form-label" for="username">
          Nom d'utilisateur
        </label>
        <div class="input-wrap">
          <i class="fas fa-user input-icon"></i>
          <input class="form-input"
                 type="text"
                 id="username"
                 name="username"
                 placeholder="Entrez votre identifiant"
                 required autofocus autocomplete="off"
                 value="{{ request.form.username if request.form.username else '' }}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          Mot de passe
        </label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input class="form-input"
                 type="password"
                 id="password"
                 name="password"
                 placeholder="••••••••"
                 required autocomplete="off">
          <button type="button" class="pwd-toggle"
                  onclick="togglePwd('password', this)"
                  tabindex="-1">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-auth">
        <i class="fas fa-sign-in-alt"></i>
        Se connecter
      </button>

    </form>

    <div class="auth-divider">Sécurité</div>

    <div style="text-align:center">
      <div class="security-badge">
        <i class="fas fa-lock"></i>
        Connexion chiffrée et sécurisée
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="auth-footer">
    <i class="fas fa-shield-alt" style="color:var(--blue)"></i>
    Smart NetSec SOC Platform v1.0<br>
    Projet de fin d'études — MRINO | BOUZIDI
  </div>

</div>

<script src="/static/js/auth.js"></script>
</body>
</html>
