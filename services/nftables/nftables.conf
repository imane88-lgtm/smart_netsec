#!/usr/sbin/nft -f
# Smart NetSec SOC — nftables configuration

flush ruleset

table inet netsec_filter {
    chain netsec_input {
        type filter hook input priority 0;
        policy accept;

        # Connexions établies
        ct state established,related accept

        # Loopback
        iifname "lo" accept

        # ICMP
        ip protocol icmp accept

        # SSH admin
        tcp dport 22 accept

        # Dashboard web
        tcp dport 5000 accept

        # Log et drop explicite (si règle drop ajoutée)
    }

    chain netsec_output {
        type filter hook output priority 0;
        policy accept;
    }

    chain netsec_forward {
        type filter hook forward priority 0;
        policy accept;
    }
}
